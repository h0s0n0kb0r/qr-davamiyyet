<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlk Qeydiyyat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fff5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #ffffff; padding: 35px 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(220, 53, 69, 0.12); border: 1px solid #f8d7da; width: 100%; max-width: 380px; }
        h3 { text-align: center; margin-bottom: 25px; color: #dc3545; font-size: 24px; font-weight: 700; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #495057; font-size: 14px; }
        input { width: 100%; padding: 11px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
        .btn-red { width: 100%; padding: 12px; background-color: #dc3545; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-red:hover { background-color: #bb2d3b; }
        .error { color: #842029; background-color: #f8d7da; border: 1px solid #f5c2c7; padding: 10px; border-radius: 6px; margin-bottom: 18px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h3>Xoş gəldiniz!</h3>
    <p style="text-align: center; color: #6c757d; font-size: 13px; margin-bottom: 20px;">Zəhmət olmasa ilk dəfə olaraq məlumatlarınızı daxil edin (bu yalnız bir dəfə tələb olunur).</p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/register" id="regForm">
        <input type="hidden" id="device_id" name="device_id">
        
        <div class="form-group">
            <label for="name">Ad və Soyad:</label>
            <input type="text" id="name" name="name" placeholder="Məs: Həsən Əkbərov" required>
        </div>
        <div class="form-group">
            <label for="email">Gmail Adresi:</label>
            <input type="email" id="email" name="email" placeholder="ornek@gmail.com" required>
        </div>
        <button type="submit" class="btn-red">Təsdiq Et və Başla</button>
    </form>
</div>

<script>
// Cihaz imzasını yaradır və gizli inputa yazır
function getOrCreateDeviceId() {
    let deviceId = localStorage.getItem('device_fingerprint_id');
    if (!deviceId) {
        deviceId = 'DEV-' + 'xxxx-4xxx-yxxx'.replace(/[xy]/g, function(c) {
            const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        }) + '-' + Date.now().toString(36);
        localStorage.setItem('device_fingerprint_id', deviceId);
    }
    return deviceId;
}

// Səhifə açılan kimi cihazın artıq qeydiyyatdan keçib-keçmədiyini yoxlayırıq
window.onload = function() {
    const deviceId = getOrCreateDeviceId();
    document.getElementById('device_id').value = deviceId;

    // Əgər bu cihaz artıq bazada varsa, qeydiyyat səhifəsində boşuna gözlətməyib birbaşa ana səhifəyə/girişə atırıq
    fetch('/api/check-device', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_id: deviceId })
    })
    .then(res => res.json())
    .then(data => {
        if (data.registered) {
            window.location.href = '/';
        }
    });
};
</script>

</body>
</html>
