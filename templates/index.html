<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davamiyyəti Qeydə Al</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #fff5f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: #ffffff; 
            padding: 35px 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(220, 53, 69, 0.12); 
            border: 1px solid #f8d7da;
            width: 100%; 
            max-width: 380px; 
            text-align: center;
        }
        h3 { color: #dc3545; margin-bottom: 5px; }
        p.user-info { color: #6c757d; font-size: 14px; margin-bottom: 25px; }
        .btn-checkin { 
            width: 100%; 
            padding: 15px; 
            background-color: #dc3545; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 18px; 
            transition: background-color 0.2s;
        }
        .btn-checkin:hover { background-color: #bb2d3b; }
        .btn-checkin:disabled { background-color: #6c757d; cursor: not-allowed; }
        #status { margin-top: 20px; font-weight: bold; font-size: 15px; }
        .logout-link { display: inline-block; margin-top: 25px; color: #6c757d; text-decoration: none; font-size: 14px; }
        .logout-link:hover { color: #dc3545; }
    </style>
</head>
<body>

<div class="card">
    <h3>Xoş gəldiniz!</h3>
    <p class="user-info">Aktiv hesab: <b>{{ email }}</b></p>

    <button id="checkin-btn" class="btn-checkin" onclick="sendLocation()">📍 Girişi Qeydə Al</button>

    <div id="status"></div>

    <a href="/logout" class="logout-link">🚪 Hesabdan Çıxış Et</a>
</div>

<script>
function sendLocation() {
    const btn = document.getElementById('checkin-btn');
    const status = document.getElementById('status');

    btn.disabled = true;
    status.style.color = "#0d6efd";
    status.innerText = "Lokasiya təyin olunur, xahiş olunur gözləyin...";

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                fetch('/api/check-in', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ latitude: lat, longitude: lng })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        status.style.color = "#198754";
                        status.innerText = "✅ " + data.message;
                    } else {
                        status.style.color = "#dc3545";
                        status.innerText = "❌ " + data.message;
                    }
                    btn.disabled = false;
                })
                .catch(err => {
                    status.style.color = "#dc3545";
                    status.innerText = "❌ Xəta baş verdi. Yenidən cəhd edin.";
                    btn.disabled = false;
                });
            },
            function(error) {
                status.style.color = "#dc3545";
                status.innerText = "❌ Lokasiyaya icazə verilmədi! Zəhmət olmasa telefonunuzun GPS-ini və brauzer icazəsini açın.";
                btn.disabled = false;
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    } else {
        status.style.color = "#dc3545";
        status.innerText = "❌ Cihazınız GPS lokasiyanı dəstəkləmir.";
        btn.disabled = false;
    }
}
</script>

</body>
</html>
